{{- if .Values.localRuntime }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nexus.fullname" . }}-config
  labels:
    {{- include "nexus.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwt-secret: {{ .Values.auth.jwtSecret | quote }}
  gemini-api-key: {{ .Values.config.geminiApiKey | quote }}
  claude-api-key: {{ .Values.config.claudeApiKey | default "" | quote }}
  nebius-api-key: {{ .Values.config.nebiusApiKey | default "" | quote }}
  pinecone-api-key: {{ .Values.config.pineconeApiKey | default "" | quote }}
  byoc-session-credential: {{ .Values.config.byocSessionCredential | default "" | quote }}
{{- end }}
