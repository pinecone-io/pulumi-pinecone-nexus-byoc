{{- $fullname := include "nexus-fdb.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-fdb-headless
  labels:
    {{- include "nexus-fdb.componentLabels" (dict "root" . "component" "fdb") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "nexus-fdb.selectorLabels" (dict "root" . "component" "fdb") | nindent 4 }}
  ports:
    - name: fdb
      port: 4500
      targetPort: 4500
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-fdb
  labels:
    {{- include "nexus-fdb.componentLabels" (dict "root" . "component" "fdb") | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-fdb-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "nexus-fdb.selectorLabels" (dict "root" . "component" "fdb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexus-fdb.selectorLabels" (dict "root" . "component" "fdb") | nindent 8 }}
      annotations:
        ad.datadoghq.com/fdb.logs: '[{"source": "foundationdb", "service": "{{ $fullname }}_fdb"}]'
    spec:
      {{- include "nexus-fdb.servicesScheduling" . | nindent 6 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fdb
          image: "{{ .Values.foundationdb.image.repository }}:{{ .Values.foundationdb.image.tag }}"
          env:
            - name: FDB_NETWORKING_MODE
              value: "container"
            - name: FDB_PORT
              value: "4500"
            # Write the cluster file to a shared emptyDir so the init-db sidecar
            # (separate container, separate filesystem) configures the SAME
            # database the server runs, and the readiness probe's fdbcli uses it.
            - name: FDB_CLUSTER_FILE
              value: "/shared/fdb.cluster"
          ports:
            - name: fdb
              containerPort: 4500
          volumeMounts:
            - name: data
              mountPath: /var/fdb/data
            - name: fdb-cluster
              mountPath: /shared
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - fdbcli -C /shared/fdb.cluster --exec "status minimal" --timeout {{ .Values.foundationdb.readinessProbe.fdbcliTimeout | default 5 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: {{ .Values.foundationdb.readinessProbe.timeoutSeconds | default 1 }}
          resources:
            {{- toYaml .Values.foundationdb.resources | nindent 12 }}
        - name: init-db
          image: "{{ .Values.foundationdb.image.repository }}:{{ .Values.foundationdb.image.tag }}"
          env:
            - name: FDB_CLUSTER_FILE
              value: "/shared/fdb.cluster"
          volumeMounts:
            - name: fdb-cluster
              mountPath: /shared
          command:
            - sh
            - -c
            - |
              # Wait for the fdb container to write the shared cluster file, then
              # configure the database (idempotent; no-op after first boot).
              while [ ! -f /shared/fdb.cluster ]; do sleep 1; done
              fdbcli --exec "configure new single {{ .Values.foundationdb.storageEngine | default "ssd" }}" --timeout 60 || true
              exec sleep infinity
      volumes:
        - name: fdb-cluster
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.foundationdb.storage.size }}
